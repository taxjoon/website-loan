services:
  web:
    image: nginx:1.27-alpine
    container_name: hjoon-website
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
